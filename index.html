<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>מערכת "מחודדין" - סיוע לעריכה תורנית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a8a", // כחול תורני עמוק
                        secondary: "#b45309", // זהב עתיק להדגשות
                        "background-light": "#f8f7f2", // קרם עדין
                        "background-dark": "#0f172a",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                        "tonal-light": "#e0f2fe",
                        "tonal-dark": "#334155"
                    },
                    fontFamily: {
                        display: ["Frank Ruhl Libre", "serif"],
                        sans: ["Assistant", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                    },
                },
            },
        };
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        body { font-family: 'Assistant', sans-serif; }
        .torani-text { font-family: 'Frank Ruhl Libre', serif; }
        
        /* עיצוב רשימת התוצאות */
        .output-content li { 
            position: relative; 
            padding-right: 2rem; 
            margin-bottom: 1.2rem; 
            line-height: 1.6; 
            font-size: 1.25rem; 
            color: inherit;
            font-family: 'Frank Ruhl Libre', serif;
        }
        .output-content li::before { 
            content: "♦"; 
            position: absolute; 
            right: 0; 
            color: #1e3a8a; 
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        /* Loader Animation */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader { border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

<div id="app" class="flex-grow flex flex-col items-center">
    
    <!-- Dark Mode Toggle -->
    <div class="fixed top-6 left-6 z-50">
        <button class="p-3 rounded-full bg-surface-light dark:bg-surface-dark shadow-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all text-primary dark:text-blue-300" onclick="document.documentElement.classList.toggle('dark')">
            <span class="material-symbols-outlined block dark:hidden">dark_mode</span>
            <span class="material-symbols-outlined hidden dark:block">light_mode</span>
        </button>
    </div>

    <!-- Main Content -->
    <main class="w-full max-w-4xl p-6 md:p-12 space-y-10 flex-grow flex flex-col items-center">
        
        <header class="text-center space-y-4 max-w-2xl">
            <div class="inline-flex items-center justify-center p-4 rounded-full bg-tonal-light dark:bg-slate-800 text-primary dark:text-blue-300 mb-2 shadow-sm">
                <span class="material-symbols-outlined text-4xl">auto_stories</span>
            </div>
            <div class="space-y-2">
                <p class="text-sm font-bold tracking-[0.3em] text-slate-500 dark:text-slate-400">בס"ד</p>
                <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-slate-900 dark:text-white font-display">
                    מערכת "מחודדין"
                </h1>
                <p class="text-xl text-slate-500 dark:text-slate-400 font-light">
                    כלי עזר לעריכה תורנית והפקת שאלות מן המציאות
                </p>
            </div>
        </header>

        <!-- Input Card -->
        <div class="w-full bg-surface-light dark:bg-surface-dark rounded-[2rem] shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-800 p-8 flex flex-col space-y-6 relative overflow-hidden">
            <!-- Decorative top border -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-primary via-blue-600 to-primary"></div>

            <div class="flex items-center justify-between">
                <label class="text-lg font-bold text-slate-700 dark:text-slate-200 font-display flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">edit_note</span>
                    הזנת המאמר לעיבוד:
                </label>
                <div class="flex space-x-2 rtl:space-x-reverse">
                    <!-- Future feature icons could go here -->
                </div>
            </div>

            <div class="relative group">
                <textarea v-model="inputText" 
                          class="w-full bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 text-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all resize-none placeholder-slate-400 dark:placeholder-slate-600 text-slate-800 dark:text-slate-200 font-light min-h-[250px]" 
                          placeholder="אנא הדבק כאן את תוכן המאמר, השיעור או הסוגיה ההלכתית..." rows="8"></textarea>
            </div>

            <div class="flex justify-center pt-2">
                <button @click="generateContent" :disabled="loading || !inputText"
                        class="bg-primary hover:bg-blue-800 text-white px-10 py-4 rounded-full font-bold text-lg shadow-lg shadow-primary/30 transition-all hover:scale-[1.02] active:scale-95 flex items-center space-x-3 rtl:space-x-reverse disabled:opacity-50 disabled:cursor-not-allowed w-full md:w-auto justify-center">
                    <div v-if="loading" class="loader ml-2"></div>
                    <span class="material-symbols-outlined" v-if="!loading">psychology</span>
                    <span>{{ loading ? 'מעבד נתונים...' : 'הפקת שאלות מן המציאות' }}</span>
                </button>
            </div>
            
            <!-- Error Message -->
            <div v-if="error" class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-300 p-4 rounded-xl text-sm flex items-center gap-2">
                <span class="material-symbols-outlined">error</span>
                {{ error }}
            </div>
        </div>

        <!-- Output Card -->
        <div v-if="output" class="w-full bg-surface-light dark:bg-surface-dark rounded-[2rem] shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-800 p-8 md:p-10 animate-fade-in">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b border-slate-100 dark:border-slate-700 pb-4">
                <h2 class="text-2xl font-bold text-slate-800 dark:text-white font-display flex items-center gap-2">
                    <span class="material-symbols-outlined text-secondary">lightbulb</span>
                    השאלות שהופקו:
                </h2>
                
                <div class="flex items-center gap-3">
                    <button @click="copyToClipboard" class="px-4 py-2 rounded-full border border-slate-200 dark:border-slate-700 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors flex items-center gap-2">
                        <span class="material-symbols-outlined text-base">content_copy</span>
                        {{ copied ? 'הועתק!' : 'העתקה' }}
                    </button>
                    <button @click="downloadText" class="px-4 py-2 rounded-full bg-tonal-light dark:bg-slate-800 text-primary dark:text-blue-300 text-sm font-bold hover:bg-blue-100 dark:hover:bg-slate-700 transition-colors flex items-center gap-2">
                        <span class="material-symbols-outlined text-base">download</span>
                        ייצוא
                    </button>
                </div>
            </div>
            
            <div class="output-content prose prose-slate dark:prose-invert max-w-none text-right" v-html="renderedOutput"></div>
        </div>

        <!-- Settings Toggle (Hidden/Minimal) -->
        <div class="w-full flex flex-col items-center pt-8">
            <button @click="showSettings = !showSettings" class="text-slate-400 hover:text-primary transition text-xs font-bold flex items-center gap-1 opacity-60 hover:opacity-100">
                <span class="material-symbols-outlined text-base">settings</span>
                הגדרות מערכת
            </button>
            
            <div v-if="showSettings" class="mt-4 w-full max-w-md bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-700 transition-all">
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wide">מפתח Gemini API</label>
                <div class="relative">
                    <input type="password" v-model="apiKey" class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-primary/50 outline-none transition-all" placeholder="הדבק את המפתח כאן">
                    <span class="material-symbols-outlined absolute left-3 top-3 text-slate-400">key</span>
                </div>
                <p class="text-[10px] text-slate-400 mt-2 text-center">המערכת פועלת על בסיס מודל Gemini 3 Flash לביצועים מיטביים</p>
            </div>
        </div>

    </main>

    <footer class="py-8 border-t border-slate-200 dark:border-slate-800 w-full mt-auto bg-white dark:bg-slate-900">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm text-slate-400 dark:text-slate-600 font-light flex items-center justify-center gap-2">
                <span>מערכת אוטומטית לעיבוד שפה טבעית</span>
                <span class="h-1 w-1 rounded-full bg-slate-300 dark:bg-slate-700"></span>
                <span>גרסה 3.0</span>
            </p>
        </div>
    </footer>
</div>

<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                apiKey: localStorage.getItem('gemini_api_key_v3') || '',
                inputText: '',
                output: '',
                loading: false,
                error: null,
                showSettings: false,
                copied: false
            }
        },
        watch: {
            apiKey(newKey) {
                localStorage.setItem('gemini_api_key_v3', newKey);
            }
        },
        computed: {
            renderedOutput() {
                if (!this.output) return '';
                return marked.parse(this.output);
            }
        },
        methods: {
            async generateContent() {
                if (!this.apiKey) {
                    this.error = "אנא הגדר מפתח API בהגדרות המערכת שבתחתית העמוד.";
                    return;
                }
                
                this.loading = true;
                this.error = null;
                this.output = '';

                // שימוש במודל Gemini 3 Flash כפי שנדרש
                const model = "gemini-3-flash-preview";
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${this.apiKey}`;

                const systemPrompt = `
                אתה עורך תורני מומחה לעריכת מדורי הלכה למעשה.
                תפקידך: לנתח את המאמר התורני המצורף ולחלץ ממנו פתיח של 6-8 שאלות מן המציאות היומיומית.
                
                עקרונות הכתיבה:
                1. אל תסכם את המאמר. תרגם את הסברות ההלכתיות לסיטואציות של שנות ה-2020.
                2. השתמש במקרים מעשיים: קניות אונליין, מוצרי צריכה מודרניים, חקלאות מתועשת, טיולים, משלוחים וכו'.
                3. מבנה כל שאלה: הצגת מקרה מעשי קצר -> פעולה -> התעוררות הספק ההלכתי.
                4. שפה: רהוטה, מכובדת ומושכת, המותאמת לקוראי עלונים תורניים.
                5. פורמט: רשימה פשוטה שכל שורה בה מתחילה בסימן ♦.
                
                הפק את השאלות בצורה נקייה, ללא כותרות מיותרות או הסברים מסביב.
                `;

                const payload = {
                    contents: [{
                        parts: [{ text: systemPrompt + "\n\n" + this.inputText }]
                    }]
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    if (result.candidates && result.candidates[0].content.parts[0].text) {
                        this.output = result.candidates[0].content.parts[0].text;
                    } else if (result.error) {
                        throw new Error(result.error.message);
                    } else {
                        throw new Error("לא התקבלה תשובה תקינה מהשרת.");
                    }
                } catch (err) {
                    this.error = "שגיאה בעיבוד: " + err.message;
                } finally {
                    this.loading = false;
                }
            },
            copyToClipboard() {
                const el = document.createElement('textarea');
                el.value = this.output;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                this.copied = true;
                setTimeout(() => this.copied = false, 2000);
            },
            downloadText() {
                const blob = new Blob([this.output], { type: 'text/plain;charset=utf-8' });
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'mahudadin_questions.txt';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
            }
        }
    }).mount('#app');
</script>

</body>
</html>
